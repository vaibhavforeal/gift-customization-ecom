<body class="bg-background text-on-background font-body-md antialiased min-h-screen selection:bg-primary-container selection:text-on-primary-container">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        // --- Shared Components ---

        const TopAppBar = ({ title = "[Your Brand]", hideNav = false, showBack = false }) => {
            const navigate = useNavigate();
            return (
                <header className="bg-surface dark:bg-on-surface docked full-width top-0 border-b border-outline-variant/20 flat no shadows flex justify-between items-center px-margin-mobile md:px-margin-desktop w-full py-stack-sm sticky z-50">
                    {showBack ? (
                        <button onClick={() => navigate(-1)} aria-label="Back" className="text-primary dark:text-primary-fixed-dim hover:text-secondary transition-colors opacity-80 p-2">
                            <span className="material-symbols-outlined" style={{fontSize: '24px'}}>arrow_back</span>
                        </button>
                    ) : (
                        <button aria-label="Menu" className="text-primary dark:text-primary-fixed-dim hover:text-secondary transition-colors opacity-80 md:hidden p-2">
                            <span className="material-symbols-outlined" style={{fontSize: '24px'}}>menu</span>

                                <Link to="/" className="text-on-surface-variant font-label-md text-label-md hover:text-secondary transition-colors opacity-80 transition-opacity">Home</Link>
                                <Link to="/build" className="text-on-surface-variant font-label-md text-label-md hover:text-secondary transition-colors">Build</Link>
                                <Link to="/tracking" className="text-on-surface-variant font-label-md text-label-md hover:text-secondary transition-colors">Orders</Link>
                            </nav>
                        </div>
                    )}

                    <Link to="/" className={`font-headline-lg text-headline-lg text-primary dark:text-primary-fixed-dim italic tracking-tight text-center ${(!hideNav && !showBack) ? 'flex-1 md:flex-none' : 'flex-1'} cursor-pointer`}>
                        {title}

                    {!hideNav && (
                        <div className="flex items-center gap-6">
                            <div className="hidden md:block">
                                <Link to="/" className="text-on-surface-variant font-label-md text-label-md hover:text-secondary transition-colors">Account</Link>
                            </div>
                            <button aria-label="Shopping Bag" className="text-primary dark:text-primary-fixed-dim hover:text-secondary transition-colors opacity-80 p-2 relative">

                            </button>
                        </div>
                    )}
                </header>
            );
        };

        const BottomNavBar = () => {
            const location = useLocation();
            const getActiveClasses = (paths) => paths.includes(location.pathname) ? "bg-secondary-container/30 text-primary scale-95 font-bold" : "text-on-surface-variant hover:bg-surface-container-high";
            const getIconFilled = (paths) => paths.includes(location.pathname) ? "1" : "0";

            return (
                <nav className="md:hidden bg-surface dark:bg-inverse-surface docked full-width bottom-0 rounded-t-xl border-t border-outline-variant/30 shadow-[0_-4px_12px_rgba(156,62,34,0.05)] shadow-sm fixed left-0 w-full z-50 flex justify-around items-center px-2 py-3 backdrop-blur-md">
                    <Link to="/" className={`flex flex-col items-center justify-center px-4 py-1 transition-all rounded-lg ${getActiveClasses(['/'])}`}>

                        <span className="font-label-md text-[10px] mt-1 leading-tight">Home</span>

                    <Link to="/build" className={`flex flex-col items-center justify-center px-4 py-1 transition-all rounded-lg ${getActiveClasses(['/build'])}`}>
                        <span className="material-symbols-outlined" style={{fontVariationSettings: `'FILL' ${getIconFilled(['/build'])}`}}>card_giftcard</span>

                        <span className="font-label-md text-[10px] mt-1 leading-tight">Account</span>
                    </Link>
                </nav>
            );

                <div className="font-headline-md text-headline-md text-primary dark:text-primary-fixed italic tracking-tight">
                    [Your Brand]
                </div>
                <div className="flex flex-wrap justify-center gap-stack-md">
                    <a className="text-on-surface-variant font-label-md text-label-md hover:text-tertiary transition-colors duration-300 focus:ring-1 focus:ring-tertiary outline-none rounded px-1" href="#">Sourcing</a>
                    <a className="text-on-surface-variant font-label-md text-label-md hover:text-tertiary transition-colors duration-300 focus:ring-1 focus:ring-tertiary outline-none rounded px-1" href="#">Sustainability</a>
                    <a className="text-on-surface-variant font-label-md text-label-md hover:text-tertiary transition-colors duration-300 focus:ring-1 focus:ring-tertiary outline-none rounded px-1" href="#">Artisan Stories</a>
                    <a className="text-on-surface-variant font-label-md text-label-md hover:text-tertiary transition-colors duration-300 focus:ring-1 focus:ring-tertiary outline-none rounded px-1" href="#">Contact</a>
                </div>
                <div className="font-body-md text-body-md text-secondary dark:text-secondary-fixed mt-stack-sm opacity-70">
                    © 2024 [Your Brand]. Handcrafted with love in India.
                </div>

        );

        // --- Screens ---

        const LandingPage = () => {

                                    Handcrafted gifts for life's biggest moments.
                                </h1>
                                <p className="font-body-lg text-body-lg mb-stack-md text-surface-container-high opacity-90">
                                    Curated hampers for pre-wedding, house-warming, and festivals.
                                </p>
                                <button onClick={() => navigate('/build')} className="bg-primary text-on-primary font-label-md text-label-md px-8 py-4 rounded-full shadow-[0_4px_24px_rgba(156,62,34,0.3)] hover:bg-surface-tint transition-all active:scale-95">
                                    Build your hamper
                                </button>
                            </div>
                        </section>
                    </main>
                    <Footer />
                    <BottomNavBar />
                </div>
            );
        };

        const BuildPage = () => {
            const navigate = useNavigate();
            return (

                                                <button onClick={() => navigate('/checkout')} className="bg-primary text-on-primary px-4 py-2 rounded-lg font-label-md text-label-md">Add</button>
                                            </div>
                                        </div>

                                </div>
                            </section>

                        <div className="max-w-container-max mx-auto px-margin-desktop py-4 flex items-center justify-between">
                            <div className="flex items-center gap-stack-md">
                                <div className="bg-surface-container-high p-3 rounded-lg text-primary">
                                    <span className="material-symbols-outlined">package_2</span>
                                </div>
                                <div>
                                    <p className="font-label-md text-label-md text-on-surface-variant">Current Hamper</p>
                                    <p className="font-headline-md text-headline-md text-on-surface">3 items <span className="text-outline mx-1">·</span> ₹1,050</p>
                                </div>
                            </div>
                            <button onClick={() => navigate('/checkout')} className="bg-secondary text-on-secondary px-8 py-3 rounded-lg font-label-md text-label-md">View hamper</button>
                        </div>
                    </div>
                    <BottomNavBar />
                </div>
            );
        };

        const CheckoutPage = () => {
            const navigate = useNavigate();
            return (
                <div className="flex flex-col min-h-screen">
                    <TopAppBar hideNav={true} showBack={true} />
                    <main className="flex-grow w-full max-w-2xl mx-auto px-margin-mobile py-stack-lg">
                        <div className="mb-stack-lg text-center">
                            <h1 className="font-display-lg-mobile text-display-lg-mobile text-primary mb-stack-sm">Almost there.</h1>
                            <p className="font-body-md text-body-md text-on-surface-variant">Complete your order details below.</p>
                        </div>
                        <form className="space-y-stack-md relative" onSubmit={(e) => { e.preventDefault(); navigate('/confirmation'); }}>
                            <div className="flex flex-col gap-unit">
                                <label className="font-label-md text-label-md text-on-surface">Full name</label>
                                <input required className="w-full bg-surface-container-lowest border border-outline-variant rounded p-stack-sm font-body-md text-body-md" type="text" defaultValue="Eleanor Vance"/>
                            </div>
                            <button type="submit" className="w-full bg-primary text-on-primary font-label-md text-label-md py-stack-sm px-stack-md rounded mt-8">Pay now</button>
                        </form>
                    </main>
                </div>
            );
        };

        const ConfirmationPage = () => {
            const navigate = useNavigate();
            return (
                <div className="flex flex-col min-h-screen">
                    <TopAppBar />
                    <main className="flex-grow w-full max-w-[480px] mx-auto px-margin-mobile py-stack-lg flex flex-col gap-stack-lg">
                        <section className="flex flex-col items-center text-center pt-stack-md">
                            <div className="mb-stack-sm text-tertiary-fixed-dim">
                                <span className="material-symbols-outlined text-[64px]" style={{fontVariationSettings: "'FILL' 1"}}>check_circle</span>

                            <h1 className="font-display-lg-mobile text-display-lg-mobile text-primary mb-unit">Order confirmed!</h1>
                            <p className="font-body-md text-body-md text-on-surface-variant flex items-center gap-2">Order # ORD-2026-0001</p>
                        </section>
                        <section className="flex flex-col gap-stack-sm mt-auto pb-stack-lg">
                            <button onClick={() => navigate('/tracking')} className="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-lg">Track your order</button>

                    </main>
                    <BottomNavBar />
                </div>
            );

        const TrackingPage = () => {
            return (
                <div className="flex flex-col min-h-screen bg-background">
                    <TopAppBar showBack={true} />
                    <main className="flex-1 w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-stack-lg flex flex-col gap-stack-lg pb-24 md:pb-stack-lg">
                        <section className="text-center md:text-left flex flex-col gap-stack-sm">
                            <h1 className="font-display-lg-mobile md:font-display-lg text-on-surface">Your hamper's journey.</h1>
                            <p className="font-body-md text-body-md text-on-surface-variant">Order #ORD-2026-0001 placed on October 24, 2026</p>
                        </section>
                        <section className="bg-surface-container-lowest rounded-xl p-stack-md md:p-margin-desktop border border-outline-variant/30 shadow-[0_8px_32px_rgba(156,62,34,0.03)] relative overflow-hidden">
                            <div className="flex flex-col md:flex-row items-center justify-between relative z-10 w-full">
                                <div className="flex flex-col items-center gap-unit w-full md:w-1/4 relative mb-stack-md md:mb-0">
                                    <div className="w-12 h-12 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-[0_4px_12px_rgba(156,62,34,0.2)] z-10">

                                </div>
                            </div>
                        </section>
                    </main>
                    <Footer />

                </div>
            );

        const App = () => {
            return (
                <MemoryRouter>
                    <Routes>
                        <Route path="/" element={<LandingPage />} />
                        <Route path="/build" element={<BuildPage />} />
                        <Route path="/checkout" element={<CheckoutPage />} />
                        <Route path="/confirmation" element={<ConfirmationPage />} />
                        <Route path="/tracking" element={<TrackingPage />} />
                    </Routes>
                </MemoryRouter>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
