    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        function App() {
            return (
                <MemoryRouter initialEntries={['/login']}>
                    <Routes>
                        <Route path="/login" element={<Login />} />
                        <Route path="/" element={<Layout><Dashboard /></Layout>} />
                        <Route path="/products" element={<Layout><Products /></Layout>} />
                        <Route path="/products/edit" element={<Layout><EditProduct /></Layout>} />
                        <Route path="/orders" element={<Layout><Orders /></Layout>} />
                        <Route path="/orders/detail" element={<Layout><OrderDetail /></Layout>} />
                    </Routes>
                </MemoryRouter>
            );
        }

        // Shared Layout with Sidebar
        function Layout({ children }) {
            const location = useLocation();
            
            const isActive = (path) => {
                if (path === '/' && location.pathname === '/') return true;
                if (path !== '/' && location.pathname.startsWith(path)) return true;
                return false;
            };

            return (
                <div class="flex w-full h-screen overflow-hidden">
                    {/* Sidebar */}
                    <aside class="w-64 bg-surface-container-lowest border-r border-outline-variant/30 flex flex-col justify-between hidden md:flex h-screen sticky top-0 z-20">
                        <div>
                            <div class="px-gutter py-stack-md border-b border-outline-variant/20 mb-stack-sm flex items-center justify-center">
                                <span class="font-headline-md text-headline-md text-primary italic tracking-tight">Kasturi</span>
                            </div>
                            <nav class="px-stack-sm space-y-unit">
                                <Link to="/" class={`flex items-center gap-stack-sm px-4 py-3 rounded-lg font-label-md text-label-md transition-all border border-transparent ${isActive('/') ? 'bg-secondary-container/20 text-primary' : 'text-on-surface-variant hover:bg-surface-container-high hover:text-secondary'}`}>
                                    <span class={`material-symbols-outlined ${isActive('/') ? 'fill' : ''}`}>dashboard</span>
                                    Dashboard
                                </Link>
                                <Link to="/orders" class={`flex items-center gap-stack-sm px-4 py-3 rounded-lg font-label-md text-label-md transition-all border border-transparent ${isActive('/orders') ? 'bg-secondary-container/20 text-primary' : 'text-on-surface-variant hover:bg-surface-container-high hover:text-secondary'}`}>
                                    <span class={`material-symbols-outlined ${isActive('/orders') ? 'fill' : ''}`}>receipt_long</span>
                                    Orders
                                </Link>
                                <Link to="/products" class={`flex items-center gap-stack-sm px-4 py-3 rounded-lg font-label-md text-label-md transition-all border border-transparent ${isActive('/products') ? 'bg-secondary-container/20 text-primary' : 'text-on-surface-variant hover:bg-surface-container-high hover:text-secondary'}`}>
                                    <span class={`material-symbols-outlined ${isActive('/products') ? 'fill' : ''}`}>card_giftcard</span>
                                    Products
                                </Link>
                                <a href="#" class="flex items-center gap-stack-sm px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-secondary transition-all">
                                    <span class="material-symbols-outlined">settings</span>
                                    Settings
                                </a>

                        </div>

                                <span class="material-symbols-outlined">logout</span>
                                Sign Out
                            </Link>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-background">
                        {/* Mobile Header */}
                        <div class="md:hidden flex justify-between items-center px-margin-mobile w-full py-stack-sm bg-surface fixed top-0 left-0 right-0 z-30 border-b border-outline-variant/20">

                                <span class="font-label-md text-label-md mt-1 text-[10px]">Home</span>
                            </Link>
                            <Link to="/products" class={`flex flex-col items-center justify-center px-4 py-1 rounded-lg ${isActive('/products') ? 'bg-secondary-container/30 text-primary scale-95' : 'text-on-surface-variant hover:bg-surface-container-high'}`}>

                                <span class="material-symbols-outlined">person</span>
                                <span class="font-label-md text-label-md mt-1 text-[10px]">Account</span>
                            </Link>
                        </nav>

            const navigate = useNavigate();

            return (
                <main class="w-full h-full flex items-center justify-center">
                    <div class="w-full max-w-md">
                        <div class="bg-surface-container-lowest rounded-lg border border-outline-variant/30 shadow-[0_12px_40px_rgba(156,62,34,0.06)] relative overflow-hidden px-margin-mobile py-stack-lg md:px-stack-lg flex flex-col items-center">
                            <div class="absolute top-0 left-0 w-full flex justify-center items-center pt-stack-sm opacity-60">
                                <div class="h-[1px] bg-tertiary/40 w-16"></div>
                                <svg class="mx-2 text-tertiary" fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">

                                </div>
                                <div class="flex flex-col gap-unit">

                                            <span class="material-symbols-outlined text-[20px]">visibility</span>

                                    </div>
                                </div>
                                <button class="mt-stack-sm w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-4 px-6 rounded-md transition-colors duration-300 flex items-center justify-center shadow-sm" type="submit">
                                    Sign in
                                </button>
                            </form>
                            <p class="font-caption text-caption text-on-surface-variant/70 mt-stack-md text-center">Admin access only.</p>
                        </div>
                    </div>
                </main>
            );
        }

        function Dashboard() {
            return (

                    <header class="bg-surface-container-lowest border-b border-outline-variant/20 h-20 flex items-center justify-between px-margin-desktop sticky top-0 z-10 hidden md:flex">

                                <p class="font-display-lg text-display-lg text-error">12</p>
